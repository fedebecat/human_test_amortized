<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Edit Failure Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column (prompt, pair, scale), a sticky status bar, an owner-only panel below. */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --ink: #1b2129;
  --muted: #5d6673;
  --line: #d9dde3;
  --accent: #1f6f78;
  --accent-ink: #ffffff;
  --accent-soft: #e2f0f1;
  --warn: #9a4b00;
  --ok: #2f6b3a;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181d; --surface: #1c2128; --ink: #e6e9ee; --muted: #9aa3ae; --line: #2e353e;
    --accent: #5fb3bb; --accent-ink: #0d1b1d; --accent-soft: #1f3337; --warn: #e0a15f; --ok: #7fc28a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181d; --surface: #1c2128; --ink: #e6e9ee; --muted: #9aa3ae; --line: #2e353e;
  --accent: #5fb3bb; --accent-ink: #0d1b1d; --accent-soft: #1f3337; --warn: #e0a15f; --ok: #7fc28a;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 860px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.bar h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.01em; }
.progress { font-family: var(--font-mono); font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { flex: 1 1 160px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 120px; }
.meter > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.chip { font-size: 0.8rem; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: currentColor; }
.chip.warn { color: var(--warn); border-color: currentColor; }
.wrap {
  max-width: 860px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.card h2 { font-size: 1.25rem; margin: 0; text-wrap: balance; }
.card p, .card li { max-width: 68ch; margin: 0; }
.card ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.scale-ref { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
.scale-ref dt { font-family: var(--font-mono); font-weight: 500; color: var(--accent); }
.scale-ref dd { margin: 0; }
.eyebrow { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.prompt { font-size: 1.15rem; font-weight: 700; }
.prompt q { quotes: "\201C" "\201D"; }
.pair { display: grid; gap: 6px; }
.labels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem; color: var(--muted); }
.labels span:last-child { color: var(--ink); font-weight: 700; }
.pair img { width: 100%; height: auto; aspect-ratio: 776 / 384; max-width: 100%; border-radius: 4px; background: var(--line); display: block; }
.scale { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.scale button {
  font: 500 1.1rem var(--font-mono); padding: 12px 0; border-radius: 6px; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
}
.scale button:hover:not(:disabled) { border-color: var(--accent); }
.scale button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scale button:disabled { cursor: not-allowed; opacity: .5; }
.anchors { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-size: 0.78rem; color: var(--muted); }
.anchors span:nth-child(1) { grid-column: 1 / span 2; }
.anchors span:nth-child(2) { grid-column: 3 / span 3; text-align: center; }
.anchors span:nth-child(3) { grid-column: 6 / span 2; text-align: right; }
.nav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.btn {
  font: 700 0.95rem var(--font-body); padding: 9px 16px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, .scale button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 0.85rem; color: var(--muted); }
.notice { border-left: 3px solid var(--warn); padding: 8px 12px; background: var(--accent-soft); color: var(--ink); border-radius: 4px; }
.owner table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.owner th, .owner td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.owner td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
kbd { font-family: var(--font-mono); font-size: 0.85em; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
@media (max-width: 520px) {
  .card { padding: 14px; }
  .scale button { padding: 10px 0; font-size: 1rem; }
  .anchors { font-size: 0.7rem; }
}
@media (prefers-reduced-motion: reduce) { .meter > i { transition: none; } }
</style>

<style>
html, body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
*, *::before, *::after { box-sizing: border-box; }
.namebox { display: grid; gap: 6px; max-width: 360px; }
.namebox label { font-weight: 700; font-size: 0.9rem; }
.namebox input { font: 1rem var(--font-body); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.namebox input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.wrap, .bar-in { max-width: 1040px; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 8px; align-items: end; }
.trio .lab { font-size: 0.85rem; color: var(--muted); }
.trio .lab.strong { color: var(--ink); font-weight: 700; }
.trio img { width: 100%; height: auto; display: block; border-radius: 4px; background: var(--line); }
.trio .orig { aspect-ratio: 1 / 1; }
.trio .pairimg { grid-column: 2 / span 2; aspect-ratio: 776 / 384; }
@media (max-width: 520px) { .trio .lab { font-size: 0.72rem; } }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.lang button { font: 500 0.8rem var(--font-mono); padding: 6px 9px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lang button:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <h1 data-i18n="title">Edit Failure Study</h1>
    <span class="progress" id="progress"></span>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <span class="chip" id="status"></span>
    <div class="lang" role="group" aria-label="Language / Lingua">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="it" aria-pressed="false">IT</button>
    </div>
    <button class="btn" id="toggle-help" type="button" data-i18n="instructions">Instructions</button>
  </div>
</header>

<main class="wrap">
  <section class="card" id="help">
    <span class="eyebrow" data-i18n="before">Before you start</span>
    <h2 data-i18n="help_title">Rate how badly an image edit has failed</h2>
    <p data-i18n-html="help_p1"></p>
    <p data-i18n="help_p2"></p>
    <dl class="scale-ref">
      <dt>1</dt><dd data-i18n="anchor1_long"></dd>
      <dt>4</dt><dd data-i18n="anchor4_long"></dd>
      <dt>7</dt><dd data-i18n="anchor7_long"></dd>
    </dl>
    <ul>
      <li data-i18n="tip_between"></li>
      <li data-i18n="tip_look"></li>
      <li data-i18n="tip_pose"></li>
      <li data-i18n="tip_time"></li>
      <li data-i18n-html="tip_keys"></li>
    </ul>
    <div class="namebox">
      <label for="name" data-i18n="name_label">Your name or initials (optional)</label>
      <input id="name" type="text" maxlength="80" autocomplete="off">
    </div>
    <div class="notice" id="access-note" hidden></div>
    <div class="nav"><span class="hint" data-i18n="privacy"></span>
      <button class="btn primary" id="start" type="button"></button></div>
  </section>

  <section class="card" id="task" hidden>
    <div><span class="eyebrow" id="item-label"></span></div>
    <div class="prompt"><span data-i18n="prompt_label">Prompt:</span> <q id="prompt"></q></div>
    <div class="trio">
      <span class="lab" data-i18n="orig_label">Original photo</span>
      <span class="lab" data-i18n="ref_label">Reference edit</span>
      <span class="lab strong" data-i18n="rate_label">Edit to rate</span>
      <img id="orig-img" class="orig" alt="" width="384" height="384">
      <img id="pair-img" class="pairimg" alt="" width="776" height="384">
    </div>
    <div class="scale" id="scale" role="group"></div>
    <div class="anchors" aria-hidden="true"><span data-i18n="anchor1"></span><span data-i18n="anchor4"></span><span data-i18n="anchor7"></span></div>
    <div class="nav">
      <button class="btn" id="back" type="button" data-i18n="back">← Back</button>
      <span class="hint" id="item-hint"></span>
      <button class="btn" id="forward" type="button" data-i18n="forward">Forward →</button>
    </div>
  </section>

  <section class="card" id="done" hidden>
    <span class="eyebrow" data-i18n="finished">Finished</span>
    <h2 data-i18n="done_title"></h2>
    <p id="done-status"></p>
    <div class="nav">
      <button class="btn" id="review" type="button" data-i18n="review"></button>
      <button class="btn" id="download" type="button" data-i18n="download"></button>
    </div>
  </section>
</main>

const store = {

  set(k, v) { try { localStorage.setItem("efs." + k, JSON.stringify(v)); } catch { /* storage unavailable: keep in memory */ } },
};
function newId() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch {}
  return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 12);
}
function initialLang() {
  try { const q = new URLSearchParams(location.search).get("lang"); if (q === "it" || q === "en") return q; } catch {}
  const s = store.get("lang", null); if (s === "it" || s === "en") return s;
  return (navigator.language || "").toLowerCase().startsWith("it") ? "it" : "en";
}
const state = { id: store.get("id", null), name: store.get("name", ""), ratings: store.get("ratings", {}), outbox: store.get("outbox", []),
  order: [], pos: 0, shownAt: 0, sending: false, lang: initialLang(), status: ["st_loading", ""], view: "help" };
if (!state.id) { state.id = newId(); store.set("id", state.id); }
function t(key, vars) { let s = (I18N[state.lang] || I18N.en)[key] ?? I18N.en[key] ?? key; for (const k in (vars || {})) s = s.replaceAll("{" + k + "}", vars[k]); return s; }
function promptText(p) { return state.lang === "it" ? (PROMPT_IT[p] || p) : p.replace(/�/g, "’"); }

function hashString(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function shuffled(seed) { const rnd = mulberry32(seed), a = PAIRS.map((_, i) => i); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
state.order = shuffled(hashString(state.id));

function setStatus(key, kind, vars) { state.status = [key, kind || "", vars || {}]; const s = $("status"); s.textContent = t(key, vars); s.className = "chip" + (kind ? " " + kind : ""); }
function ratedCount() { return Object.keys(state.ratings).filter((k) => state.ratings[k] && state.ratings[k].r).length; }
function renderProgress() { const n = ratedCount(); $("progress").textContent = t("progress", { n, N }); $("meter").style.width = (100 * n / N) + "%"; }
function firstUnrated() { const i = state.order.findIndex((k) => !state.ratings[PAIRS[k].id]); return i < 0 ? N : i; }
function connected() { return ENDPOINT && !ENDPOINT.startsWith("__"); }
function statusAtRest() {
  if (!connected()) setStatus("st_local", "warn");
  else if (state.outbox.length) setStatus("st_waiting", "warn", { n: state.outbox.length });
  else setStatus(ratedCount() ? "st_sent" : "st_ready", "ok");
}

function applyLang() {
  document.documentElement.lang = state.lang;
  document.title = t("title");
  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
  for (const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang));
  $("name").placeholder = t("name_ph");
  $("pair-img").alt = t("img_alt");
  $("orig-img").alt = t("orig_alt");
  $("scale").setAttribute("aria-label", t("scale_aria"));
  $("start").textContent = ratedCount() ? t("resume", { n: ratedCount(), N }) : t("start");
  if (!connected()) { const n = $("access-note"); n.hidden = false; n.textContent = t("not_connected"); }
  setStatus(state.status[0], state.status[1], state.status[2]);
  renderProgress();
  if (state.view === "task") show(state.pos, true);
  if (state.view === "done") show(N, true);
}

const scale = $("scale");
for (let v = 1; v <= 7; v++) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = v; b.dataset.v = v; b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => rate(v));
  scale.appendChild(b);
}
function preload(pos) { for (let k = 1; k <= 3; k++) { const p = state.order[pos + k]; if (p !== undefined) { const im = new Image(); im.src = "pairs/" + PAIRS[p].id + ".jpg"; const o = new Image(); o.src = "orig/" + PAIRS[p].src + ".jpg"; } } }

function show(pos, keepTimer) {
  if (pos >= N) {
    state.view = "done"; $("task").hidden = true; $("done").hidden = false; renderProgress();
    $("done-status").textContent = state.outbox.length ? t("done_waiting") : t("done_sent");
    return;
  }
  state.view = "task";
  state.pos = Math.max(0, pos);
  const pair = PAIRS[state.order[state.pos]];
  $("done").hidden = true; $("task").hidden = false;
  $("item-label").textContent = t("item", { i: state.pos + 1, N });
  $("prompt").textContent = promptText(pair.prompt);
  $("pair-img").src = "pairs/" + pair.id + ".jpg";
  $("orig-img").src = "orig/" + pair.src + ".jpg";
  const cur = state.ratings[pair.id];
  for (const b of scale.children) b.setAttribute("aria-pressed", String(!!cur && cur.r === Number(b.dataset.v)));
  $("back").disabled = state.pos === 0;
  $("forward").disabled = !(cur && cur.r) || state.pos >= N - 1;
  $("item-hint").textContent = cur && cur.r ? t("rated_hint", { r: cur.r }) : "";
  if (!keepTimer) state.shownAt = performance.now();
  renderProgress(); preload(state.pos);
}

async function flush() {
  if (state.sending || !state.outbox.length || !connected()) { statusAtRest(); return; }
  state.sending = true;
  const batch = state.outbox.slice(0, 50);
  const body = JSON.stringify({ annotator: state.id, name: state.name, version: VERSION + "-" + state.lang, items: batch });
  setStatus("st_sending");
  let sent = false;
  try {
    const res = await fetch(ENDPOINT, { method: "POST", body });
    const js = await res.json();
    sent = !!(js && js.ok);
  } catch {
    try { await fetch(ENDPOINT, { method: "POST", body, mode: "no-cors" }); sent = true; } catch { sent = false; }
  }
  if (sent) { state.outbox = state.outbox.slice(batch.length); store.set("outbox", state.outbox); }
  state.sending = false;
  if (sent && state.outbox.length) setTimeout(flush, 300);
  else statusAtRest();
  if (state.view === "done") show(N);
}
setInterval(() => { if (state.outbox.length) flush(); }, 30000);
window.addEventListener("online", flush);

function rate(v) {
  if (state.view !== "task" || state.pos >= N) return;
  const pid = PAIRS[state.order[state.pos]].id;
  const entry = { r: v, t: new Date().toISOString(), ms: Math.round(performance.now() - state.shownAt), pos: state.pos };
  state.ratings[pid] = entry;
  state.outbox.push({ pair: pid, ...entry });
  store.set("ratings", state.ratings); store.set("outbox", state.outbox);
  flush();
  const next = state.order.findIndex((k, i) => i > state.pos && !state.ratings[PAIRS[k].id]);
  show(next < 0 ? firstUnrated() : next);
}

for (const b of document.querySelectorAll(".lang button")) b.addEventListener("click", () => { state.lang = b.dataset.lang; store.set("lang", state.lang); applyLang(); });
$("back").addEventListener("click", () => show(state.pos - 1));
$("forward").addEventListener("click", () => show(state.pos + 1));
$("review").addEventListener("click", () => show(N - 1));
$("toggle-help").addEventListener("click", () => { $("help").hidden = !$("help").hidden; if (!$("help").hidden) $("help").scrollIntoView({ block: "start" }); });
$("name").value = state.name;
$("name").addEventListener("change", () => { state.name = $("name").value.trim().slice(0, 80); store.set("name", state.name); });
$("start").addEventListener("click", () => { state.name = $("name").value.trim().slice(0, 80); store.set("name", state.name); $("help").hidden = true; show(firstUnrated()); });
$("download").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ annotator: state.id, name: state.name, version: VERSION + "-" + state.lang, ratings: state.ratings }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "edit-failure-ratings-" + state.id.slice(0, 8) + ".json";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});
document.addEventListener("keydown", (ev) => {
  if (ev.target && (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA")) return;
  if (state.view === "help") return;
  if (/^[1-7]$/.test(ev.key) && state.view === "task") { ev.preventDefault(); rate(Number(ev.key)); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); if (state.view === "done") show(N - 1); else if (state.pos > 0) show(state.pos - 1); }
  else if (ev.key === "ArrowRight" && state.view === "task") { const cur = state.ratings[PAIRS[state.order[state.pos]].id]; if (cur && cur.r && state.pos < N - 1) { ev.preventDefault(); show(state.pos + 1); } }
});

applyLang(); flush();
</script>
</body>
</html>
